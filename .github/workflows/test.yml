name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pw:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: pw tests, including the real costco-sync through the bridge
        working-directory: pw
        run: PYTHONPATH=src:tests python -m unittest discover -s tests

  costco-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - working-directory: integrations/costco
        run: |
          pip install -e ".[dev]"
          pytest -q

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pantry-wizard"
version = "2.3.0"
description = "The pw tool: every read and write an agent makes to a Pantry Wizard sheet"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
sheets = ["google-api-python-client>=2.100", "google-auth>=2.20"]

[project.scripts]
pw = "pantry_wizard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

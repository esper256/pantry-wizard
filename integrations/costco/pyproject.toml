[project]
name = "costco-sync"
version = "0.1.0"
description = "Import Costco warehouse receipts and known-SKU prices into a shopping-list mutation file."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "costco-mcp-server>=0.1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
costco-sync = "costco_sync.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
